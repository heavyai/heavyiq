[pytest]
addopts = -rs -n 0 --maxfail=1 --disable-warnings -m "not integration"
filterwarnings =
    ignore::Warning
markers =
    integration: marks tests as integration tests (require external services like ChromaDB, embedding server)
    e2e: marks tests as end-to-end API tests (require full app stack with HeavyDB and LLM)
    anyio: marks tests as async tests