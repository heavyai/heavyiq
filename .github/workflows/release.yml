name: CI
run-name: ${{ inputs.description != '' && format('heavyiq — {0}', inputs.description) || 'heavyiq CI' }}

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Branch or SHA to build'
        type: string
        default: 'master'
      build_arm64:
        description: 'Also build Ubuntu ARM64 variant'
        type: boolean
        default: false
      build_rhel:
        description: 'Also build Rocky Linux (RHEL) variant'
        type: boolean
        default: false
      description:
        description: 'Build description label'
        type: string
        default: ''

jobs:
  build-ubuntu:
    runs-on: linux-amd64-cpu16
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate || github.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build (Ubuntu x86_64)
        run: bash ./scripts/build_prod.sh --include_all_deps

      - name: Run tests
        run: |
          source venv/bin/activate
          pip install -r requirements-dev.txt
          pytest tests --no-heavydb

  build-ubuntu-arm64:
    if: ${{ inputs.build_arm64 }}
    runs-on: linux-arm64-cpu16
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate || github.sha }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build (Ubuntu ARM64)
        run: bash ./scripts/build_prod.sh --include_all_deps

      - name: Run tests
        run: |
          source venv/bin/activate
          pip install -r requirements-dev.txt
          pytest tests --no-heavydb

  build-rocky:
    if: ${{ inputs.build_rhel }}
    runs-on: linux-amd64-cpu16
    container:
      image: rockylinux/rockylinux:8
    permissions:
      contents: read
    steps:
      - name: Install git, Python 3.11, and gh CLI
        run: |
          dnf install -y git python3.11
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate || github.sha }}

      - name: Build (Rocky Linux x86_64)
        run: |
          git config --global --add safe.directory "$(pwd)"
          bash ./scripts/build_prod_rhel.sh --include_all_deps

      - name: Run tests
        run: |
          source venv/bin/activate
          pip install -r requirements-dev.txt
          pytest tests --no-heavydb
