version: '3'

services:
  heavyiq-api:
    container_name: heavyiq-api
    build:
      context: .
      dockerfile: ./environment/heavyiq_api/Dockerfile.customer  # Specify the custom Dockerfile name
    ports:
      - "8000:8000"
    command: ["gunicorn", "-b", ":8000", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "--preload", "heavyiq.api:create_app()"]

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - heavyai/heavylm-latest
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --trust-remote-code
      - --max-num-batched-tokens
      - "8192"
      - --max-model-len
      - "8192"
      - --dtype
      - float16
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./environment/vllm/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=
    ports:
      - "5000:5000"
    ipc: host
