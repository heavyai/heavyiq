# HeavyIQ with Ubuntu 22.04
#
# Usage (from project root):
#   docker-compose -f docker/docker-compose.ubuntu.yml up --build
#
# Or use the scripts:
#   ./scripts/start-heavyiq.sh
#   ./scripts/stop-heavyiq.sh
#
# If you can't access the internal image, set BASE_IMAGE before running:
#   BASE_IMAGE=ubuntu:22.04 docker-compose -f docker/docker-compose.ubuntu.yml up --build
#
# ChromaDB is started internally by gunicorn, no separate service needed.
#
version: '3.8'

services:
  heavyiq:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ubuntu
      args:
        # Use internal image by default; override with BASE_IMAGE=ubuntu:22.04 if not available
        BASE_IMAGE: ${BASE_IMAGE:-docker-internal.mapd.com/mapd/core-build-ubuntu22.04-static-cuda12.2.2-x86_64-jenkins-ssh:latest}
    container_name: heavyiq-ubuntu
    ports:
      - "16279:6279"
    volumes:
      # Mount current directory to /code for live development
      - ..:/code
      # Persist storage directories
      - ../storage:/code/storage
      # Mount container config as config.toml (read-only)
      - ../config.container.toml:/code/config.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    extra_hosts:
      # Access host machine services (like heavyaiserver on port 16274)
      - "host.docker.internal:host-gateway"
    working_dir: /code
    # Run gunicorn server
    command: >
      gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:6279 --timeout 120 --preload "heavyiq.api:create_app('config.toml')"
    networks:
      - heavyiq-net
    restart: unless-stopped

networks:
  heavyiq-net:
    driver: bridge
